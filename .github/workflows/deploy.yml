      #       "Server=tcp:${SQL_FQDN},1433;Initial Catalog=switchpoint;User ID=${SQL_ADMIN_LOGIN};Password=${SQL_ADMIN_PASSWORD};Encrypt=True;Connection Timeout=60;"
