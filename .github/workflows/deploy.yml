      # - name: Open a temporary SQL firewall rule for this runner
      #   env:
      #     RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      #     SQL_FQDN: ${{ steps.infra.outputs.sqlServerFqdn }}
      #   run: |
      #     runner_ip=$(curl -sS https://api.ipify.org)
      #     az sql server firewall-rule create -g "$RG" -s "${SQL_FQDN%%.*}" -n "github-runner-${GITHUB_RUN_ID}" \
      #       --start-ip-address "$runner_ip" --end-ip-address "$runner_ip" -o none
