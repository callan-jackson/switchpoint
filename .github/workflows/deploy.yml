      # - name: Apply migrations
      #   env:
      #     SQL_FQDN: ${{ steps.infra.outputs.sqlServerFqdn }}
      #     SQL_ADMIN_LOGIN: switchpointadmin
      #     SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
